services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chiban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chiban}
      POSTGRES_DB: ${POSTGRES_DB:-chiban}
    ports:
      # Loopback only: PostgreSQL must never be reachable from outside the
      # host, on the Mac mini or anywhere else.
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chiban} -d ${POSTGRES_DB:-chiban}"]
      interval: 5s
      timeout: 3s
      retries: 10

  fake-gcs:
    image: fsouza/fake-gcs-server:1.52
    # -filesystem-root, not -data. `-data` only says where to LOAD existing
    # data from at startup; writes go to -filesystem-root, which defaults to
    # /storage. Pointing the volume at /data therefore persisted nothing and
    # every upload lived in the container's writable layer until it was
    # recreated.
    command: ["-scheme", "http", "-port", "4443", "-backend", "filesystem", "-filesystem-root", "/data"]
    ports:
      # Loopback only: fake-gcs has no authentication of its own.
      - "127.0.0.1:${FAKE_GCS_PORT:-14443}:4443"
    volumes:
      - fake-gcs-data:/data

  api:
    build:
      context: ./apps/api
    environment:
      CHIBAN_HTTP_ADDR: ":8080"
      CHIBAN_DATABASE_URL: postgres://${POSTGRES_USER:-chiban}:${POSTGRES_PASSWORD:-chiban}@postgres:5432/${POSTGRES_DB:-chiban}?sslmode=disable
      CHIBAN_STORAGE_EMULATOR_HOST: http://fake-gcs:4443
      CHIBAN_WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      CHIBAN_SECURE_COOKIES: ${SECURE_COOKIES:-false}
    ports:
      # Loopback only: public traffic arrives through Cloudflare Tunnel,
      # which reaches the API over the compose network.
      - "127.0.0.1:${API_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      fake-gcs:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${API_PORT:-18080}}
    environment:
      # Browser-side calls go to the API through the host/tunnel, not the
      # compose network, so this is a public URL.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${API_PORT:-18080}}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  # Only started with `--profile tunnel`. Local development does not need it.
  #
  # Configured from a file rather than a token: a token makes the tunnel
  # remotely managed, which puts the routing in the Cloudflare dashboard where
  # nothing reviews it and a wrong dropdown surfaces as a 502 with the reason
  # buried in these logs. See deploy/cloudflared/config.yml.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ./deploy/cloudflared:/etc/cloudflared:ro
    restart: unless-stopped
    depends_on:
      - web
      - api

volumes:
  postgres-data:
  fake-gcs-data:
