  </style>

    </div>

    <p style="margin: 0; max-width: 720px; font-size: 14px; line-height: 1.75; color: #6b5a4d; text-wrap: pretty">

    </p>
  </div>

    <rect x="276" y="244" width="472" height="452" rx="6" fill="#f9a129"/>
    <circle cx="512" cy="470" r="148" fill="#f7f3e9"/>
    <circle cx="512" cy="470" r="90" fill="#ea6e52"/>
    <circle cx="470" cy="432" r="27" fill="#f7f3e9" opacity="0.7"/>
  </g>
  <g transform="rotate(-45 340 290)">
    <rect x="220" y="258" width="240" height="64" rx="3" fill="#37c695" opacity="0.92"/>
  </g></svg>
      </div>
    </div>
  </div>

  </g></svg></div>

  <rect width="1024" height="1024" fill="#c13f29"/>

  <g transform="rotate(-45 340 290)">
    <rect x="220" y="258" width="240" height="64" rx="3" fill="#37c695" opacity="0.92"/>
  </g></svg></div>
        <span style="font-size: 11px; color: #6b5a4d; letter-spacing: 0.1em">無遮罩(方形)</span>
