<html>

  <script src="./support.js"></script>

<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, &#39;PingFang TC&#39;, &#39;Noto Sans TC&#39;, system-ui, sans-serif; }
    a { color: #af2d18; } a:hover { color: #8d1d0a; }
    
  </style>
</helmet>
<div style="width: 1240px; min-height: 1620px; box-sizing: border-box; padding: 72px; background: #f7f3e9;
            background-image: radial-gradient(circle at 1px 1px, rgba(184,159,124,0.22) 1px, transparent 0);
            background-size: 7px 7px; display: flex; flex-direction: column; gap: 56px">

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; gap: 14px">
      <span style="font-family: Georgia, &#39;Songti TC&#39;, &#39;Noto Serif TC&#39;, &#39;Source Han Serif TC&#39;, serif; font-size: 18px; color: #af2d18; letter-spacing: 0.16em">方向 B</span>
      <h1 style="margin: 0; font-family: Georgia, &#39;Songti TC&#39;, &#39;Noto Serif TC&#39;, &#39;Source Han Serif TC&#39;, serif; font-size: 40px; font-weight: 400; color: #2b221a">一碗話</h1>
      <span style="font-size: 14px; color: #6b5a4d; letter-spacing: 0.08em">Bowl in a bubble</span>
    </div>
    <p style="margin: 0; max-width: 720px; font-size: 15px; line-height: 1.8; color: #2b221a; text-wrap: pretty">對話框裡放一副碗筷。這支 app 的核心不是吃,是「吃完之後那段對話」,外框直接把它講出來。</p>
    <p style="margin: 0; max-width: 720px; font-size: 14px; line-height: 1.75; color: #6b5a4d; text-wrap: pretty">
      <span style="color: #af2d18">取捨 &#183;</span> 兩層資訊(框 + 碗),32px 時碗會糊成一團,只剩對話框可讀。
    </p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 20px">
    <div style="font-size: 12px; color: #6b5a4d; letter-spacing: 0.12em">1024 &#215; 1024 &#183; 母稿(實際大小)</div>
    <div style="display: flex; gap: 40px; align-items: flex-start">
      <div style="width: 1024px; height: 1024px; border-radius: 22.37%; overflow: hidden; flex: none; box-shadow: 0 24px 48px -32px rgba(64,40,24,0.55)">

  <rect width="1024" height="1024" fill="#c13f29"/>
  <path d="M 240 168 H 784 a 96 96 0 0 1 96 96 V 664 a 96 96 0 0 1 -96 96 H 404 L 292 892 L 300 760 H 240 a 96 96 0 0 1 -96 -96 V 264 a 96 96 0 0 1 96 -96 Z" fill="#f7f3e9"/>
  <g stroke="#c13f29" stroke-width="36" stroke-linecap="round">
    <path d="M 348 398 L 688 266"/>
    <path d="M 366 450 L 706 318"/>
  </g>
  <rect x="300" y="498" width="424" height="54" rx="27" fill="#c13f29"/>
  <path d="M 338 566 H 686 C 686 668, 608 712, 512 712 C 416 712, 338 668, 338 566 Z" fill="#c13f29"/></svg>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 24px; padding-top: 44px; border-top: 1px solid #e5ddd0">
    <div style="font-size: 12px; color: #6b5a4d; letter-spacing: 0.12em">實際使用尺寸(1:1,沒有放大)</div>
    <div style="display: flex; align-items: flex-end; gap: 56px">

  <rect width="1024" height="1024" fill="#c13f29"/>
  <path d="M 240 168 H 784 a 96 96 0 0 1 96 96 V 664 a 96 96 0 0 1 -96 96 H 404 L 292 892 L 300 760 H 240 a 96 96 0 0 1 -96 -96 V 264 a 96 96 0 0 1 96 -96 Z" fill="#f7f3e9"/>

    <path d="M 366 450 L 706 318"/>
  </g>
  <rect x="300" y="498" width="424" height="54" rx="27" fill="#c13f29"/>
  <path d="M 338 566 H 686 C 686 668, 608 712, 512 712 C 416 712, 338 668, 338 566 Z" fill="#c13f29"/></svg></div>
          <span style="font-size: 11px; color: #6b5a4d; letter-spacing: 0.1em">180 &#183; iPhone 主畫面 @3x</span>
        </div>
      
        <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
          <div style="width: 64px; height: 64px; border-radius: 22.37%; overflow: hidden; flex: none"><svg viewBox="0 0 1024 1024" width="64" height="64" style="display: block" role="img" aria-label="方向 B">
  <rect width="1024" height="1024" fill="#c13f29"/>
  <path d="M 240 168 H 784 a 96 96 0 0 1 96 96 V 664 a 96 96 0 0 1 -96 96 H 404 L 292 892 L 300 760 H 240 a 96 96 0 0 1 -96 -96 V 264 a 96 96 0 0 1 96 -96 Z" fill="#f7f3e9"/>

    <path d="M 366 450 L 706 318"/>
  </g>
  <rect x="300" y="498" width="424" height="54" rx="27" fill="#c13f29"/>
  <path d="M 338 566 H 686 C 686 668, 608 712, 512 712 C 416 712, 338 668, 338 566 Z" fill="#c13f29"/></svg></div>
          <span style="font-size: 11px; color: #6b5a4d; letter-spacing: 0.1em">64 &#183; 設定 / 分享</span>
        </div>
      
        <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
          <div style="width: 32px; height: 32px; border-radius: 22.37%; overflow: hidden; flex: none"><svg viewBox="0 0 1024 1024" width="32" height="32" style="display: block" role="img" aria-label="方向 B">
  <rect width="1024" height="1024" fill="#c13f29"/>
  <path d="M 240 168 H 784 a 96 96 0 0 1 96 96 V 664 a 96 96 0 0 1 -96 96 H 404 L 292 892 L 300 760 H 240 a 96 96 0 0 1 -96 -96 V 264 a 96 96 0 0 1 96 -96 Z" fill="#f7f3e9"/>
  <g stroke="#c13f29" stroke-width="36" stroke-linecap="round">
    <path d="M 348 398 L 688 266"/>
    <path d="M 366 450 L 706 318"/>
  </g>
  <rect x="300" y="498" width="424" height="54" rx="27" fill="#c13f29"/>
  <path d="M 338 566 H 686 C 686 668, 608 712, 512 712 C 416 712, 338 668, 338 566 Z" fill="#c13f29"/></svg></div>
          <span style="font-size: 11px; color: #6b5a4d; letter-spacing: 0.1em">32 &#183; favicon</span>
        </div>
      <div style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 4px; max-width: 300px">
        <span style="font-size: 12px; color: #af2d18; letter-spacing: 0.1em">看這一排,不要看上面那張</span>
        <span style="font-size: 13px; line-height: 1.7; color: #6b5a4d; text-wrap: pretty">icon 的成敗只在這三個尺寸。母稿好看不算數。</span>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 24px; padding-top: 44px; border-top: 1px solid #e5ddd0">
    <div style="font-size: 12px; color: #6b5a4d; letter-spacing: 0.12em">遮罩</div>
    <div style="display: flex; align-items: center; gap: 48px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
        <div style="width: 140px; height: 140px; border-radius: 22.37%; overflow: hidden; flex: none"><svg viewBox="0 0 1024 1024" width="140" height="140" style="display: block" role="img" aria-label="方向 B">

  <path d="M 338 566 H 686 C 686 668, 608 712, 512 712 C 416 712, 338 668, 338 566 Z" fill="#c13f29"/></svg></div>
        <span style="font-size: 11px; color: #6b5a4d; letter-spacing: 0.1em">iOS squircle</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
        <div style="width: 140px; height: 140px; border-radius: 50%; overflow: hidden; flex: none"><svg viewBox="0 0 1024 1024" width="140" height="140" style="display: block" role="img" aria-label="方向 B">

  <path d="M 240 168 H 784 a 96 96 0 0 1 96 96 V 664 a 96 96 0 0 1 -96 96 H 404 L 292 892 L 300 760 H 240 a 96 96 0 0 1 -96 -96 V 264 a 96 96 0 0 1 96 -96 Z" fill="#f7f3e9"/>
  <g stroke="#c13f29" stroke-width="36" stroke-linecap="round">

    <path d="M 366 450 L 706 318"/>

  <rect x="300" y="498" width="424" height="54" rx="27" fill="#c13f29"/>
  <path d="M 338 566 H 686 C 686 668, 608 712, 512 712 C 416 712, 338 668, 338 566 Z" fill="#c13f29"/></svg></div>
        <span style="font-size: 11px; color: #6b5a4d; letter-spacing: 0.1em">Android 圓形</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
        <div style="width: 140px; height: 140px; overflow: hidden; flex: none"><svg viewBox="0 0 1024 1024" width="140" height="140" style="display: block" role="img" aria-label="方向 B">
  <rect width="1024" height="1024" fill="#c13f29"/>
  <path d="M 240 168 H 784 a 96 96 0 0 1 96 96 V 664 a 96 96 0 0 1 -96 96 H 404 L 292 892 L 300 760 H 240 a 96 96 0 0 1 -96 -96 V 264 a 96 96 0 0 1 96 -96 Z" fill="#f7f3e9"/>
  <g stroke="#c13f29" stroke-width="36" stroke-linecap="round">
    <path d="M 348 398 L 688 266"/>
    <path d="M 366 450 L 706 318"/>
  </g>
  <rect x="300" y="498" width="424" height="54" rx="27" fill="#c13f29"/>
  <path d="M 338 566 H 686 C 686 668, 608 712, 512 712 C 416 712, 338 668, 338 566 Z" fill="#c13f29"/></svg></div>
        <span style="font-size: 11px; color: #6b5a4d; letter-spacing: 0.1em">無遮罩(方形)</span>
      </div>
    </div>
  </div>
</div></x-dc>
</body>
</html>
